<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hidden Message Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
  :root {
    --red: rgb(255, 0, 0);
    --blue: rgb(0, 0, 255);
    --ink: #1a1a1a;
    --panel: #f4f4f5;
    --line: #d4d4d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #e9e9ec;
    color: var(--ink);
    display: flex;
    min-height: 100vh;
  }

  /* ---- Control panel ---- */
  #controls {
    width: 300px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  #controls h1 {
    font-size: 18px;
    margin: 0 0 4px;
    letter-spacing: -0.3px;
  }
  #controls p.sub {
    margin: 0;
    font-size: 12px;
    line-height: 1.5;
    color: #71717a;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: #52525b;
  }
  .field input, .field select, .field textarea {
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    color: var(--ink);
    font-family: inherit;
  }
  .field textarea {
    resize: vertical;
    line-height: 1.45;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none;
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
  }
  .row { display: flex; gap: 10px; }
  .row .field { flex: 1; }

  .buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  button {
    padding: 11px 14px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.05s ease, filter 0.15s ease;
  }
  button:active { transform: translateY(1px); }
  #generate { background: var(--ink); color: #fff; }
  #generate:hover { filter: brightness(1.25); }
  #filter, #orient { background: #fff; border: 1px solid var(--line); color: var(--ink); }
  #filter:hover, #orient:hover { background: #fafafa; }
  #filter.active { background: var(--red); color: #fff; border-color: var(--red); }
  .secondary-row { display: flex; gap: 10px; }
  .secondary-row button { flex: 1; background: #fff; border: 1px solid var(--line); color: var(--ink); }
  .secondary-row button:hover { background: #fafafa; }

  .hint {
    font-size: 11px;
    color: #a1a1aa;
    line-height: 1.5;
    border-top: 1px dashed var(--line);
    padding-top: 14px;
  }

  /* ---- Stage ---- */
  #stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
    overflow: auto;
  }
  #canvas-holder canvas {
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    display: block;
  }

  /* ---- Print: show only the artwork ---- */
  @media print {
    body { display: block; background: #fff; }
    #controls { display: none; }
    #stage { padding: 0; }
    #canvas-holder canvas { box-shadow: none; }
  }
</style>
</head>
<body>
  <div id="controls">
    <div>
      <h1>Anaglyph Generator</h1>
      <p class="sub"> Add your message to create your own anaglyph. Once your message is perfected, hit the print button, and then grab your ANGTFT glasses to decode the message.</p>
    </div>

    <div class="field">
      <label for="message">Hidden message</label>
      <textarea id="message" rows="4">FIND YOUR MEANING.</textarea>
    </div>

    <div class="field">
      <label for="density">Text density</label>
      <input id="density" type="range" min="8" max="28" value="16" />
    </div>

    <div class="field">
      <label for="msgsize">Message font size (px)</label>
      <input id="msgsize" type="range" min="8" max="120" value="36" />
    </div>

    <div class="buttons">
      <button id="generate">⚡ Generate Artwork</button>
      <button id="filter">👓 Red filter (preview)</button>
      <button id="orient">Switch to Landscape</button>
      <div class="secondary-row">
        <button id="reset">↺ Reset</button>
        <button id="print">🖨 Print</button>
      </div>
    </div>

    <p class="hint">Tip: shorter, all-caps messages read best. Lower the density slider for chunkier, easier-to-spot letters.</p>
  </div>

  <div id="stage">
    <div id="canvas-holder"></div>
  </div>

<script>
(function () {
  // ---- Source text streamed sequentially across all three noise layers ----
  const SOURCE_TEXT = "This Supplemental Privacy Policy supplements the Meta Privacy Policy and applies to your and your child's use of a Meta account and access to Meta Platforms Technologies Products. If you are a parent or guardian of a child between the ages of 10 and 12 (age may vary by region) and wish to create a Meta account for your child, please review the Parent Privacy Disclosure that describes how Meta collects, uses, and discloses your child's personal information. After you create a Meta account for your child, we will collect, use, and disclose your child's information much like any other Meta account. This Supplemental Privacy Policy applies in full to both adults and children. To the extent there are privacy practices specific to your child's Meta account, those differences are outlined in the Children's Privacy Highlight at the top of each relevant section of this Supplemental Privacy Policy. Note, the Meta Privacy Policy does not apply to the processing of your child's personal information. Meta offers a variety of hardware and software products and services related to or in connection with those products as part of Meta Platforms Technologies. The hardware, services, features, apps, technologies and software products described in the Supplemental Meta Platforms Technologies Terms of Service, and subject to this policy, include Meta VR Products, Meta Wearable Products, and other Meta Platforms Technologies Products listed here, any of which may be updated from time to time. We encourage you to read our Meta Privacy Policy and this Supplemental Meta Platforms Technologies Privacy Policy because we want you to understand what information we collect, and how we use and share it. In the Meta Privacy Policy, we describe the information we process to support Meta Products. This Supplemental Privacy Policy adds to the Meta Privacy Policy by explaining the additional information we process to support MPT Products and by providing more details about how we process that information. Below you will find an overview of the ways in which we collect, use, and share information.";

  let cfg = {
    message: "FIND YOUR MEANING.",
    w: 600,
    h: 900,
    cell: 16,
    msgSize: 36
  };

  function readControls() {
    cfg.message = document.getElementById("message").value || " ";
    cfg.cell    = parseInt(document.getElementById("density").value, 10) || 16;
    cfg.msgSize = parseInt(document.getElementById("msgsize").value, 10) || 36;
  }

  // ---- p5 sketch ----
  const sketch = (p) => {

    p.setup = function () {
      readControls();
      const c = p.createCanvas(cfg.w, cfg.h);
      c.parent("canvas-holder");
      p.noLoop();
      build();
    };

    // Build one layer: stream SOURCE_TEXT sequentially at the given font size,
    // starting at startIdx, skipping spaces, repeating as needed to fill canvas.
    function generateLayer(fontSize, startIdx) {
      const result = [];
      const stepX = fontSize * 0.58;
      const stepY = fontSize * 1.2;
      const jitter = fontSize * 0.04;
      let idx = startIdx;

      for (let y = stepY * 0.6; y < cfg.h + stepY * 0.4; y += stepY) {
        for (let x = stepX * 0.5; x < cfg.w; x += stepX) {
          let ch = SOURCE_TEXT[idx % SOURCE_TEXT.length];
          idx++;
          if (ch === ' ') { continue; }
          result.push({
            x, y, ch,
            ox: p.random(-jitter, jitter),
            oy: p.random(-jitter, jitter)
          });
        }
      }
      return result;
    }

    let layers = [];
    let filterOn = false;

    const MSG_ALPHA = 55;

    // Break str into rendered lines respecting maxWidth.
    // Falls back to character-level breaking for words wider than the box.
    function computeLines(str, maxWidth) {
      const lines = [];
      for (const para of str.split('\n')) {
        if (para === '') { lines.push(''); continue; }
        let line = '';
        for (const word of para.split(' ')) {
          if (!word) continue;
          if (p.textWidth(word) > maxWidth) {
            if (line) { lines.push(line); line = ''; }
            let chars = '';
            for (const ch of word) {
              if (p.textWidth(chars + ch) > maxWidth) { lines.push(chars); chars = ch; }
              else { chars += ch; }
            }
            line = chars;
            continue;
          }
          const test = line ? line + ' ' + word : word;
          if (p.textWidth(test) > maxWidth && line) { lines.push(line); line = word; }
          else { line = test; }
        }
        if (line) lines.push(line);
      }
      return lines;
    }

    function generate() {
      const sizeLg = cfg.cell * 2.5;
      const sizeMd = cfg.cell * 1.0;
      const sizeSm = cfg.cell * 0.5;

      // Stagger start positions so each layer shows a different part of the text
      layers = [
        { cells: generateLayer(sizeLg,   0), fontSize: sizeLg },
        { cells: generateLayer(sizeMd, 120), fontSize: sizeMd },
        { cells: generateLayer(sizeSm, 350), fontSize: sizeSm },
      ];
    }

    function render() {
      p.background(255);
      p.textAlign(p.CENTER, p.CENTER);
      p.textStyle(p.BOLD);
      p.noStroke();

      // Red noise: large layer first (bottom), medium, then small (top)
      p.fill(255, 0, 0);
      for (const layer of layers) {
        p.textSize(layer.fontSize);
        for (const c of layer.cells) {
          p.text(c.ch, c.x + c.ox, c.y + c.oy);
        }
      }

      // Hidden message: cyan at low opacity — invisible to naked eye,
      // readable through a red filter (MULTIPLY zeroes the G+B channels).
      const margin = 20;
      const availW = cfg.w - margin * 2;
      const availH = cfg.h - margin * 2;
      p.textStyle(p.NORMAL);
      p.textSize(cfg.msgSize);
      p.fill(0, 255, 255, MSG_ALPHA);
      p.textAlign(p.LEFT, p.TOP);
      const lineH = cfg.msgSize * 1.25;
      const lines = computeLines(cfg.message, availW);
      const startY = margin + Math.max(0, (availH - lines.length * lineH) / 2);
      for (let i = 0; i < lines.length; i++) {
        const ly = startY + i * lineH;
        if (ly + lineH > cfg.h - margin) break;
        p.text(lines[i], margin, ly);
      }
      p.textAlign(p.CENTER, p.CENTER);

      if (filterOn) {
        p.blendMode(p.MULTIPLY);
        p.fill(255, 0, 0);
        p.rect(0, 0, cfg.w, cfg.h);
        p.blendMode(p.BLEND);
      }
    }

    function build() {
      generate();
      render();
    }

    p.rebuild = function () {
      readControls();
      build();
    };
    p.setSize = function (w, h) {
      cfg.w = w; cfg.h = h;
      p.resizeCanvas(w, h);
      build();
    };
    p.toggleFilter = function () {
      filterOn = !filterOn;
      render();
      return filterOn;
    };
    p.setFilter = function (on) { filterOn = on; };
  };

  const instance = new p5(sketch);

  // ---- Wire up buttons ----
  const filterBtn = document.getElementById("filter");

  function clearFilterUI() {
    instance.setFilter(false);
    filterBtn.classList.remove("active");
  }

  document.getElementById("generate").addEventListener("click", () => {
    clearFilterUI();
    instance.rebuild();
  });

  filterBtn.addEventListener("click", () => {
    const on = instance.toggleFilter();
    filterBtn.classList.toggle("active", on);
  });

  document.getElementById("print").addEventListener("click", () => window.print());

  document.getElementById("reset").addEventListener("click", () => {
    document.getElementById("message").value = "FIND YOUR MEANING.";
    document.getElementById("density").value = 16;
    document.getElementById("msgsize").value = 36;
    clearFilterUI();
    instance.rebuild();
  });

  let isPortrait = true;
  document.getElementById("orient").addEventListener("click", () => {
    isPortrait = !isPortrait;
    clearFilterUI();
    if (isPortrait) {
      instance.setSize(600, 900);
      document.getElementById("orient").textContent = "Switch to Landscape";
    } else {
      instance.setSize(900, 600);
      document.getElementById("orient").textContent = "Switch to Portrait";
    }
  });
})();
</script>
</body>
</html>
